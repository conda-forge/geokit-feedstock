context:
  version: "1.9.0"
  python_min: "3.10"
  python_max: "3.13.9"

package:
  name: geokit
  version: ${{ version }}

source:
  url: https://github.com/FZJ-IEK3-VSA/geokit/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 38c9db7a491bd58a899ee5db1c844ed24b313ad93cb52ab8bea7caf44be07e78

build:
  script: ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation
  noarch: python
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }},<=${{ python_max }}
    - jupyter <=1.1.1
    - descartes <=1.1.0
    - pip <=26.1.2
    - matplotlib <=3.10.9
    - pandas >=1.4.0,<=3.0.3
    - numpy >=1.26.0,<=2.5.0
    - scipy >=1.10.0,<=1.18.0
    - scikit-learn >=1.3.0,<=1.9.0
    - gdal =3.10
    - smopy >=0.0.7,<=0.0.8
    - geopandas >=1.0.0,<=1.1.3
    - psutil >=5.8.0,<=7.2.2
    - structlog <=26.1.0
    - rich <=15.0.0
    - pandas-stubs <=3.0.3.260530
    - scipy-stubs <=1.17.1.5
    - requests <=2.34.2

tests:
  - python:
      imports:
        - geokit
  - script:
      - pytest -n auto -vvv
    requirements:
      run:
        - pytest
        - pytest-xdist
        - typeguard <=4.5.1
        - python ${{ python_min }}.*
    files:
      source:
        - .

about:
  homepage: https://github.com/FZJ-IEK3-VSA/geokit
  summary: Geokit is a library that interfaces with GDAL to support general-purpose geospatial data analysis.
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - chrisjwin
    - shitabishmam
    - julian-belina
    - phil-fzj
